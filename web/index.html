<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coding Agent</title>
  <link rel="stylesheet" href="/static/styles.css?v=32">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
</head>
<body>
  <aside>
    <h3 id="workspace">工作区</h3>
    <ul id="files"></ul>
  </aside>

  <main>
    <button id="agent-orb" type="button" aria-label="Agent">Agent</button>
    <div id="task-panel"></div>
    <div id="editor-tabs" aria-label="打开的文件"></div>
    <div id="filename">未选择文件</div>
    <div id="diff-panel" hidden></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </main>

  <section>
    <div id="chat-toolbar">
      <select id="model-select" aria-label="选择模型">
        <option value="deepseek-v4-flash">DeepSeek V4 Flash</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
        <option value="deepseek-v4-flash-vision-exp">DeepSeek V4 Flash Vision</option>
      </select>
      <select id="reasoning-select" aria-label="推理深度">
        <option value="off">Off</option>
        <option value="low" selected>Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="compact-context" type="button">压缩上下文</button>
      <span id="image-status"></span>
      <span id="context-ring" title="上下文用量"><span>0%</span></span>
      <span id="context-status" aria-live="polite"></span>
    </div>
    <div id="messages"></div>
    <form id="chat">
      <textarea id="input" placeholder="输入编程任务... (Shift+Enter换行)"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </section>

  <script type="module" src="/static/app.js?v=30"></script>
</body>
</html>
